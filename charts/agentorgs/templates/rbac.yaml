apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentorgs-controller
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentorgs-controller
rules:
  - apiGroups: ["agentorgs.io"]
    resources: ["members", "groups", "collaborations", "policies", "members/status", "groups/status", "collaborations/status", "policies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentorgs-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentorgs-controller
subjects:
  - kind: ServiceAccount
    name: agentorgs-controller
    namespace: {{ .Values.namespace }}
