{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.credentials.minioAccessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.credentials.minioSecretKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: {{ .Values.minio.service.port }}
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
          envFrom:
            - secretRef:
                name: minio
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
{{- end }}
