{{- if .Values.matrix.enabled }}
{{- $tuwunelName := printf "%s-tuwunel" .Release.Name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $tuwunelName }}
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: tuwunel
  ports:
    - name: matrix
      port: {{ .Values.matrix.service.port }}
      targetPort: matrix
      nodePort: {{ .Values.matrix.service.nodePort }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $tuwunelName }}
  namespace: {{ .Values.namespace }}
spec:
  serviceName: {{ $tuwunelName }}
  replicas: 1
  selector:
    matchLabels:
      app: tuwunel
  template:
    metadata:
      labels:
        app: tuwunel
    spec:
      containers:
        - name: tuwunel
          image: "{{ .Values.matrix.image.repository }}:{{ .Values.matrix.image.tag }}"
          ports:
            - name: matrix
              containerPort: {{ .Values.matrix.service.port }}
          env:
            - name: CONDUWUIT_SERVER_NAME
              value: {{ .Values.matrix.domain | quote }}
            - name: CONDUWUIT_DATABASE_PATH
              value: /var/lib/tuwunel
            - name: CONDUWUIT_ADDRESS
              value: "0.0.0.0"
            - name: CONDUWUIT_PORT
              value: {{ .Values.matrix.service.port | quote }}
            - name: CONDUWUIT_ALLOW_REGISTRATION
              value: "true"
            # Required by tuwunel latest when allow_registration=true without a token.
            - name: CONDUWUIT_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/tuwunel
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
{{- end }}
