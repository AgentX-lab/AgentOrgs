apiVersion: v1
kind: Secret
metadata:
  name: agentorgs-runtime
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  AGENTORGS_LLM_API_KEY: {{ required "credentials.llmApiKey is required" .Values.credentials.llmApiKey | quote }}
  MINIO_ACCESS_KEY: {{ .Values.credentials.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.credentials.minioSecretKey | quote }}
  AGENTORGS_MATRIX_APPSERVICE_AS_TOKEN: {{ required "credentials.matrixAppServiceASToken is required" .Values.credentials.matrixAppServiceASToken | quote }}
  AGENTORGS_MATRIX_APPSERVICE_HS_TOKEN: {{ required "credentials.matrixAppServiceHSToken is required" .Values.credentials.matrixAppServiceHSToken | quote }}
  AGENTORGS_MATRIX_ADMIN_PASSWORD: {{ required "credentials.matrixAdminPassword is required" .Values.credentials.matrixAdminPassword | quote }}
