# E2E ONLY — two Groups, two Collaborations (two rooms), strategy All.
# mixed-team = openclaw + hermes; hermes-team = two hermes.
# Room A (mention-group-swarm): both Groups, for mixed-oc @hermes-team.
# Room B (mention-group-hermes): hermes-team only, for roster change.
apiVersion: v1
kind: Namespace
metadata:
  name: agentorgs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mention-group-swarm-channel
  namespace: agentorgs
data:
  roomId: "!mention-group-swarm-placeholder:example.org"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mention-group-hermes-channel
  namespace: agentorgs
data:
  roomId: "!mention-group-hermes-placeholder:example.org"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-runtime
  namespace: agentorgs
data:
  runtime: openclaw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-execution
  namespace: agentorgs
data:
  image: agentorgs/agent-openclaw:local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-runtime
  namespace: agentorgs
data:
  runtime: hermes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-execution
  namespace: agentorgs
data:
  image: agentorgs/agent-hermes:local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: requester-matrix
  namespace: agentorgs
data:
  userId: "@requester:matrix-local.agentorgs.io"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mixed-oc-matrix
  namespace: agentorgs
data:
  userId: "@mixed-oc:matrix-local.agentorgs.io"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mixed-hm-matrix
  namespace: agentorgs
data:
  userId: "@mixed-hm:matrix-local.agentorgs.io"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-a-matrix
  namespace: agentorgs
data:
  userId: "@hermes-a:matrix-local.agentorgs.io"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-b-matrix
  namespace: agentorgs
data:
  userId: "@hermes-b:matrix-local.agentorgs.io"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mixed-team-matrix
  namespace: agentorgs
data:
  userId: "@mixed-team:matrix-local.agentorgs.io"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-team-matrix
  namespace: agentorgs
data:
  userId: "@hermes-team:matrix-local.agentorgs.io"
---
apiVersion: agentorgs.io/v1alpha1
kind: Member
metadata:
  name: requester
  namespace: agentorgs
spec:
  displayName: E2E Swarm Requester
  type: Human
  channels:
    - provider: matrix
      config:
        name: requester-matrix
        key: userId
---
apiVersion: agentorgs.io/v1alpha1
kind: Member
metadata:
  name: mixed-oc
  namespace: agentorgs
spec:
  displayName: E2E Mixed OpenClaw
  type: Agent
  skillPack: coordination
  image: agentorgs/agent-openclaw:local
  runtime:
    provider: openclaw
    config:
      name: openclaw-runtime
  execution:
    provider: kubernetes
    config:
      name: openclaw-execution
  channels:
    - provider: matrix
      config:
        name: mixed-oc-matrix
        key: userId
---
apiVersion: agentorgs.io/v1alpha1
kind: Member
metadata:
  name: mixed-hm
  namespace: agentorgs
spec:
  displayName: E2E Mixed Hermes
  type: Agent
  skillPack: backend
  image: agentorgs/agent-hermes:local
  runtime:
    provider: hermes
    config:
      name: hermes-runtime
  execution:
    provider: kubernetes
    config:
      name: hermes-execution
  channels:
    - provider: matrix
      config:
        name: mixed-hm-matrix
        key: userId
---
apiVersion: agentorgs.io/v1alpha1
kind: Member
metadata:
  name: hermes-a
  namespace: agentorgs
spec:
  displayName: E2E Hermes A
  type: Agent
  skillPack: qa
  image: agentorgs/agent-hermes:local
  runtime:
    provider: hermes
    config:
      name: hermes-runtime
  execution:
    provider: kubernetes
    config:
      name: hermes-execution
  channels:
    - provider: matrix
      config:
        name: hermes-a-matrix
        key: userId
---
apiVersion: agentorgs.io/v1alpha1
kind: Member
metadata:
  name: hermes-b
  namespace: agentorgs
spec:
  displayName: E2E Hermes B
  type: Agent
  skillPack: qa
  image: agentorgs/agent-hermes:local
  runtime:
    provider: hermes
    config:
      name: hermes-runtime
  execution:
    provider: kubernetes
    config:
      name: hermes-execution
  channels:
    - provider: matrix
      config:
        name: hermes-b-matrix
        key: userId
---
apiVersion: agentorgs.io/v1alpha1
kind: Group
metadata:
  name: mixed-team
  namespace: agentorgs
spec:
  channels:
    - provider: matrix
      config:
        name: mixed-team-matrix
        key: userId
  members:
    - who: { kind: Member, name: mixed-oc }
    - who: { kind: Member, name: mixed-hm }
---
apiVersion: agentorgs.io/v1alpha1
kind: Group
metadata:
  name: hermes-team
  namespace: agentorgs
spec:
  channels:
    - provider: matrix
      config:
        name: hermes-team-matrix
        key: userId
  members:
    - who: { kind: Member, name: hermes-a }
    - who: { kind: Member, name: hermes-b }
---
apiVersion: agentorgs.io/v1alpha1
kind: Collaboration
metadata:
  name: mention-group-swarm
  namespace: agentorgs
spec:
  participants:
    - who: { kind: Member, name: requester }
    - who: { kind: Group, name: mixed-team }
    - who: { kind: Group, name: hermes-team }
  channel:
    provider: matrix
    config:
      name: mention-group-swarm-channel
      key: roomId
  whenTargetIsGroup:
    strategy: All
  limits:
    maxReplyRounds: 8
    timeoutMinutes: 15
---
apiVersion: agentorgs.io/v1alpha1
kind: Collaboration
metadata:
  name: mention-group-hermes
  namespace: agentorgs
spec:
  participants:
    - who: { kind: Member, name: requester }
    - who: { kind: Group, name: hermes-team }
  channel:
    provider: matrix
    config:
      name: mention-group-hermes-channel
      key: roomId
  whenTargetIsGroup:
    strategy: All
  limits:
    maxReplyRounds: 8
    timeoutMinutes: 15
---
apiVersion: agentorgs.io/v1alpha1
kind: Policy
metadata:
  name: e2e-swarm-requester-mixed
  namespace: agentorgs
spec:
  effect: Allow
  from:
    - kind: Member
      name: requester
  to:
    - kind: Group
      name: mixed-team
  actions: [Start, Continue, Cancel]
---
apiVersion: agentorgs.io/v1alpha1
kind: Policy
metadata:
  name: e2e-swarm-requester-hermes
  namespace: agentorgs
spec:
  effect: Allow
  from:
    - kind: Member
      name: requester
  to:
    - kind: Group
      name: hermes-team
  actions: [Start, Continue, Cancel]
---
apiVersion: agentorgs.io/v1alpha1
kind: Policy
metadata:
  name: e2e-swarm-mixed-to-hermes
  namespace: agentorgs
spec:
  effect: Allow
  from:
    - kind: Group
      name: mixed-team
  to:
    - kind: Group
      name: hermes-team
  actions: [Start, Continue]
