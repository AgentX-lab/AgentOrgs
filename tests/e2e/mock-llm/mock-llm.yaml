# E2E ONLY — do not use in production or local demos with real workloads.
# ConfigMap mock-llm-config is created from server.py in run.sh (SSE tool_calls).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: agentorgs
  labels:
    app: mock-llm
    agentorgs.io/e2e: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
        agentorgs.io/e2e: "true"
    spec:
      containers:
        - name: mock-llm
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 6556
          volumeMounts:
            - name: config
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: mock-llm-config
            items:
              - key: server.py
                path: server.py
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: agentorgs
  labels:
    app: mock-llm
    agentorgs.io/e2e: "true"
spec:
  selector:
    app: mock-llm
  ports:
    - name: http
      port: 6556
      targetPort: http
