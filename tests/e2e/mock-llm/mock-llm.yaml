# E2E ONLY — do not use in production or local demos with real workloads.
# Image is built and kind-loaded by tests/e2e/run.sh as agentorgs/mock-llm:local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: agentorgs
  labels:
    app: mock-llm
    agentorgs.io/e2e: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
        agentorgs.io/e2e: "true"
    spec:
      containers:
        - name: mock-llm
          image: agentorgs/mock-llm:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 6556
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: agentorgs
  labels:
    app: mock-llm
    agentorgs.io/e2e: "true"
spec:
  selector:
    app: mock-llm
  ports:
    - name: http
      port: 6556
      targetPort: http
