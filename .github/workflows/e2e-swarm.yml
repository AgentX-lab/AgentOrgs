name: e2e-swarm

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: tests/e2e/go.sum

      - name: Run swarm e2e
        env:
          AGENTORGS_CLUSTER_NAME: agentorgs-e2e-swarm
          AGENTORGS_E2E_FIXTURE: fixtures/mention_group_swarm.yaml
          AGENTORGS_E2E_RUN: TestMentionGroupSwarm
          AGENTORGS_E2E_CHANNEL_CM: mention-group-swarm-channel
        run: |
          chmod +x tests/e2e/run.sh
          bash tests/e2e/run.sh

      - name: Collect logs on failure
        if: failure()
        env:
          AGENTORGS_CLUSTER_NAME: agentorgs-e2e-swarm
          AGENTORGS_NAMESPACE: agentorgs
          AGENTORGS_E2E_CHANNEL_CM: mention-group-swarm-channel
        run: |
          chmod +x tests/e2e/collect-logs.sh
          bash tests/e2e/collect-logs.sh /tmp/e2e-logs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-swarm-logs
          path: /tmp/e2e-logs
